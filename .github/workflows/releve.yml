name: Relevé du parc

on:
  schedule:
    # 05:17 UTC : après la nuit, et à une minute qui n'est pas ronde — GitHub
    # étale mal les crons de début d'heure, ils partent souvent en retard.
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    # le gabarit ou le collecteur changent => on régénère tout de suite
    #
    # SUR `main` SEULEMENT. Sans ce filtre, toute branche qui touche à
    # `scripts/` déclenche le relevé — et comme le job commite, le robot dépose
    # un « chore(releve) » sur la branche de travail. C'est arrivé le 14/09 sur
    # une PR, et le commit a en prime ÉCRASÉ un point d'historique : le
    # `GITHUB_TOKEN` ne sait pas lire les alertes de vulnérabilité, la valeur
    # relevée avec un PAT est repassée à `null`.
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/releve.yml'

permissions:
  contents: write

concurrency:
  group: releve-du-parc
  cancel-in-progress: false

jobs:
  # Les règles pures d'abord, et sans réseau : si `fond()` a une régression, le
  # dépôt se met à commiter chaque nuit pour rien. Autant le savoir avant de
  # publier, pas trois semaines plus tard.
  regles:
    name: Règles du relevé
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm test

  relever:
    needs: regles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Relever l'état du parc
        id: releve
        env:
          # PARC_TOKEN (PAT, scope public_repo) si le jeton du dépôt ne suffit
          # pas à lire l'API Actions des autres dépôts ; sinon GITHUB_TOKEN.
          PARC_TOKEN: ${{ secrets.PARC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/releve.mjs

      - name: Publier si le fond a changé
        if: steps.releve.outputs.change == 'oui'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html historique.json
          git commit -m "chore(releve): etat du parc au $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Rien à publier
        if: steps.releve.outputs.change != 'oui'
        # bloc littéral : un « : » suivi d'une espace dans un scalaire nu
        # coupe la valeur en clé, et GitHub rejette le fichier entier
        run: |
          echo "Le fond du relevé n'a pas bougé : aucun commit (seul l'horodatage aurait changé)."
